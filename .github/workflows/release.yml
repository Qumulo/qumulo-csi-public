# Release: builds the driver images and the Helm chart from this repository
# and publishes them to the public packages, with signed build provenance.
#
#   ghcr.io/qumulo/qumulo-csi-public/qumulo-csi-driver-controller:<VERSION>
#   ghcr.io/qumulo/qumulo-csi-public/qumulo-csi-driver-node:<VERSION>
#   oci://ghcr.io/qumulo/qumulo-csi-public/charts/qumulo-csi-driver  --version <VERSION>
#
# Trigger: push a tag `v<VERSION>` (for example `v0.1.2`), or run it by hand.
# A tag that does not name the VERSION file is refused, so a release is always
# identified by its version and nothing else.
#
# Every step is a Makefile target, as in ci.yml: `make release` builds both
# images for every platform, checks the manifest lists, pushes the chart only
# once both images exist, and runs the published images with the args the
# chart passes them (test/release/check-published-images.sh).
#
# Two refusals before anything is built:
#   - a VERSION that is already published. Released tags are never moved: a
#     customer who pulled 0.1.2 keeps getting the same bytes. Bump VERSION.
#   - a csi-addons sidecar the chart pins (tag@digest) that is not in the
#     public packages. The sidecar is versioned on its own -qumulo.N tag and is
#     published by release-sidecar.yml; run that first and pin its digest.
#
# Provenance: actions/attest-build-provenance signs a SLSA provenance
# statement for each image and for the chart (Sigstore, keyless, tied to this
# workflow run) and pushes it next to the artifact. Verify with:
#   gh attestation verify oci://<image>:<VERSION> --owner Qumulo
#
# Needs, once:
#   - repository secrets RH_ORG_ID and RH_ACTIVATION_KEY: the node image
#     installs nfs-utils from the RHEL repositories (see the Makefile's RH_ENV).
#     A pull request from a fork never receives them; nothing here runs on one.
#   - an environment named `release` with required reviewers, so a tag push
#     alone cannot publish.
#   - each public package's "Manage Actions access" listing this repository
#     with the Write role (packages first created by another repository).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One release at a time, never cancelled halfway: a cancelled run could leave
# the images published and the chart not.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  REGISTRY: ghcr.io/qumulo/qumulo-csi-public

jobs:
  release:
    name: images + chart
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the release
        id: rel
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name VERSION ${version}; push v${version}" >&2
            exit 1
          fi
          sidecar="$(grep -E '^[[:space:]]+image:[[:space:]]+[^[:space:]]*/csi-addons-k8s-sidecar:' charts/qumulo-csi-driver/values.yaml | head -n1 | awk '{print $2}')"
          [[ "$sidecar" =~ ^[^@]+:[^@]+@sha256:[0-9a-f]{64}$ ]] \
            || { echo "cannot read the csi-addons sidecar tag@digest from values.yaml: '${sidecar}'" >&2; exit 1; }
          {
            echo "version=${version}"
            echo "controller=${REGISTRY}/qumulo-csi-driver-controller"
            echo "node=${REGISTRY}/qumulo-csi-driver-node"
            echo "chart=${REGISTRY}/charts/qumulo-csi-driver"
            echo "sidecar=${sidecar}"
          } >> "$GITHUB_OUTPUT"

      # Pinned exactly, as in ci.yml: the chart renders under Helm's default
      # capabilities version, so the Helm version is load-bearing.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log Helm in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: The pinned csi-addons sidecar must be published
        env:
          SIDECAR: ${{ steps.rel.outputs.sidecar }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "$SIDECAR" >/dev/null 2>&1; then
            echo "the chart pins ${SIDECAR}, which is not in the public packages." >&2
            echo "Run the 'Release csi-addons sidecar' workflow, pin the tag@digest it prints" >&2
            echo "in charts/qumulo-csi-driver/values.yaml, and release again." >&2
            exit 1
          fi
          echo "  OK   ${SIDECAR}"

      - name: VERSION must not be published yet
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          taken=0
          for ref in "${{ steps.rel.outputs.controller }}:${VERSION}" "${{ steps.rel.outputs.node }}:${VERSION}"; do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "  TAKEN    $ref"; taken=1
            else
              echo "  free     $ref"
            fi
          done
          if helm show chart "oci://${{ steps.rel.outputs.chart }}" --version "$VERSION" >/dev/null 2>&1; then
            echo "  TAKEN    oci://${{ steps.rel.outputs.chart }} ${VERSION}"; taken=1
          else
            echo "  free     oci://${{ steps.rel.outputs.chart }} ${VERSION}"
          fi
          test "$taken" -eq 0 || { echo "${VERSION} is already published; released tags are never moved. Bump VERSION." >&2; exit 1; }

      - name: Release
        env:
          RH_ORG_ID: ${{ secrets.RH_ORG_ID }}
          RH_ACTIVATION_KEY: ${{ secrets.RH_ACTIVATION_KEY }}
        run: make release REGISTRY="$REGISTRY"

      # The digests the attestations are bound to: the manifest list of each
      # image and the chart's OCI manifest, read back from the registry.
      - name: Resolve the published digests
        id: digests
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          digest() { echo "sha256:$(docker buildx imagetools inspect --raw "$1" | sha256sum | cut -d' ' -f1)"; }
          {
            echo "controller=$(digest "${{ steps.rel.outputs.controller }}:${VERSION}")"
            echo "node=$(digest "${{ steps.rel.outputs.node }}:${VERSION}")"
            echo "chart=$(digest "${{ steps.rel.outputs.chart }}:${VERSION}")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Attest the controller image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.rel.outputs.controller }}
          subject-digest: ${{ steps.digests.outputs.controller }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the node image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.rel.outputs.node }}
          subject-digest: ${{ steps.digests.outputs.node }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.rel.outputs.chart }}
          subject-digest: ${{ steps.digests.outputs.chart }}
          push-to-registry: true
          create-storage-record: false

      - name: Summary
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          {
            echo "### Released ${VERSION}"
            echo
            echo '| artifact | digest |'
            echo '| --- | --- |'
            echo "| \`${{ steps.rel.outputs.controller }}:${VERSION}\` | \`${{ steps.digests.outputs.controller }}\` |"
            echo "| \`${{ steps.rel.outputs.node }}:${VERSION}\` | \`${{ steps.digests.outputs.node }}\` |"
            echo "| \`oci://${{ steps.rel.outputs.chart }}\` ${VERSION} | \`${{ steps.digests.outputs.chart }}\` |"
            echo
            echo '```'
            echo "helm install qumulo-csi oci://${{ steps.rel.outputs.chart }} --version ${VERSION} -n qumulo-csi --create-namespace -f values.yaml"
            echo "gh attestation verify oci://${{ steps.rel.outputs.controller }}:${VERSION} --owner Qumulo"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
