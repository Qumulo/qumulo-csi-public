# Step 5 -- a pod that mounts the volume.
apiVersion: v1
kind: Pod
metadata:
  name: qumulo-example-pod
  namespace: qumulo-csi
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: qumulo-example-pvc
