# volumeClaimTemplates gives each replica its own PVC -- data-worker-0,
# data-worker-1, data-worker-2 -- rather than the one shared PVC a Deployment
# would use. Apply deploy/example/01-shared-storage/storageclass.yaml first.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
spec:
  serviceName: worker
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: qumulo-nfs41
        resources:
          requests:
            storage: 10Gi
