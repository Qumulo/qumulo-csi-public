# Source: qumulo-csi-driver/templates/metrics.yaml
# Something for Prometheus to scrape.
#
# Two Services, because the two workloads are scraped differently. The
# controller is an ordinary Deployment behind a ClusterIP. The node DaemonSet
# runs hostNetwork: true, so its pod IP is the node IP and a ClusterIP would
# load-balance across nodes and scrape a different one each time -- hence
# headless, which gives Prometheus one target per node.
apiVersion: v1
kind: Service
metadata:
  name: qumulo-csi-qumulo-csi-driver-controller-metrics
  namespace: qumulo-csi
  labels:
    helm.sh/chart: qumulo-csi-driver-0.1.1
    app.kubernetes.io/name: qumulo-csi-driver
    app.kubernetes.io/instance: qumulo-csi
    app.kubernetes.io/version: "0.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: qumulo-csi-driver
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qumulo-csi-driver
    app.kubernetes.io/instance: qumulo-csi
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 29654
      targetPort: 29654
      protocol: TCP
    # The sidecars' own metrics. Separate ports rather than one, because each
    # is a separate process with its own registry -- csi_sidecar_operations_seconds
    # from the provisioner and from the resizer are different series that
    # happen to share a name.
    - name: provisioner
      port: 29656
      targetPort: 29656
      protocol: TCP
    - name: resizer
      port: 29657
      targetPort: 29657
      protocol: TCP
    - name: snapshotter
      port: 29658
      targetPort: 29658
      protocol: TCP
---
