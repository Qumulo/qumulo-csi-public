# Source: qumulo-csi-driver/templates/node.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qumulo-csi-qumulo-csi-driver-node
  namespace: qumulo-csi
  labels:
    helm.sh/chart: qumulo-csi-driver-0.1.1
    app.kubernetes.io/name: qumulo-csi-driver
    app.kubernetes.io/instance: qumulo-csi
    app.kubernetes.io/version: "0.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: qumulo-csi-driver
    app.kubernetes.io/component: node
  # As on the controller: the driver's liveness probe reads the liveness-probe
  # sidecar's /healthz on node.healthPort, declared on that sidecar; a second
  # declaration on the driver is a duplicate-port warning on every install.
  annotations:
    ignore-check.kube-linter.io/liveness-port: "the driver probes the /healthz of the liveness-probe sidecar on node.healthPort, declared on that sidecar in the same pod"
spec:
  # A node pod counts as available only once it has been Ready this long, and
  # Ready means the kubelet registered the plugin: the driver's readiness probe
  # passes only after the kubelet's first NodeGetInfo. Without both, a build
  # that started but never registered (a wrong kubeletDir) rolled across every
  # node, and every node lost mount and unmount for every array.
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: qumulo-csi-driver
      app.kubernetes.io/instance: qumulo-csi
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        helm.sh/chart: qumulo-csi-driver-0.1.1
        app.kubernetes.io/name: qumulo-csi-driver
        app.kubernetes.io/instance: qumulo-csi
        app.kubernetes.io/version: "0.1.1"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: qumulo-csi-driver
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: qumulo-csi-qumulo-csi-driver-node
      # The node service never calls the Kubernetes API (every client the
      # driver builds is controller-only, cmd/qumulo-csi-driver/main.go), and
      # neither sidecar here does. A token on a privileged pod on every worker
      # would be an API credential nothing uses.
      automountServiceAccountToken: false
      # Explicit rather than inherited. The driver drains in-flight RPCs for
      # shutdownGracePeriod (10s) and then stops outright, so this only has to
      # be comfortably larger; stating it keeps the relationship between the
      # two numbers visible instead of one silently depending on Kubernetes'
      # 30s default.
      terminationGracePeriodSeconds: 30
      priorityClassName: "qumulo-csi-qumulo-csi-driver-node-critical"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # The kubelet talks to this plugin over a host path, and the mounts it
      # creates have to be visible in the host namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.1@sha256:f847fb218cdf1d0f0fa79772ca6f46e11d25635eb49c06efb5dccd00b5245ef5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          args:
            - --csi-address=/csi/csi.sock
            # The path as the *kubelet* sees it, not as this container does.
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.qumulo.com/csi.sock
            # Its /healthz calls GetInfo on the registrar's own registration
            # socket. That is this container's health -- a registrar whose
            # socket is gone is restarted, and recreates it -- and is what the
            # probes below read. It is NOT the plugin's registration: it stayed
            # green through a wrong kubeletDir, so the pod's readiness also
            # needs the driver container's registration marker below.
            # A host port (hostNetwork), bound to the node's own address only.
            # No pprof (no --enable-pprof).
            - --http-endpoint=$(POD_IP):29659
            - --v=2
          ports:
            - name: registrar
              containerPort: 29659
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          livenessProbe:
            httpGet:
              path: /healthz
              port: registrar
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: registrar
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources:
            limits:
              ephemeral-storage: 500Mi
              memory: 64Mi
            requests:
              cpu: 5m
              ephemeral-storage: 16Mi
              memory: 64Mi

        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.1@sha256:d06ac4f9242654f278d9c8a4e343b0516542bfc614218d469959c6428765e97f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          args:
            - --csi-address=/csi/csi.sock
            # A host port, on the node's own address only, not every
            # interface of the host, the same as the metrics port.
            - --http-endpoint=$(POD_IP):29653
          ports:
            - name: healthz
              containerPort: 29653
          # This container's own health: its listener accepts connections. Not
          # /healthz, which reports the driver's health; the driver container
          # probes that.
          livenessProbe:
            tcpSocket:
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
          resources:
            limits:
              ephemeral-storage: 500Mi
              memory: 64Mi
            requests:
              cpu: 5m
              ephemeral-storage: 16Mi
              memory: 64Mi

        - name: qumulo-csi-driver
          image: ghcr.io/qumulo/qumulo-csi-public/qumulo-csi-driver-node:0.1.1
          securityContext:
            privileged: true
          imagePullPolicy: Always
          # No Qumulo credentials here, and none needed: the node service never
          # calls the REST API. That is what keeps a cluster-wide API token off
          # every worker.
          args:
            - -mode=node
            - -endpoint=unix:///csi/csi.sock
            - -drivername=csi.qumulo.com
            - -nodeid=$(NODE_ID)
            - -log-level=info
            # Written on the kubelet's first NodeGetInfo; the readiness probe
            # below checks it.
            - -registration-marker=/run/qumulo-csi/registered
            # RPC latency and outcomes for the node service, which
            # is the half of the driver a stuck mount shows up in. No array
            # series here: the node service never calls the REST API, and
            # that is what keeps a cluster-wide API token off every worker.
            #
            # This pod is hostNetwork: true, so the port below is a HOST port
            # on every node in the DaemonSet. It must not collide with
            # anything else on a worker. Bound to the pod IP -- the node's
            # own address -- not every interface of the host.
            - -metrics-address=$(POD_IP):29655
          ports:
            # hostPort is deliberately not set: hostNetwork already makes
            # this a host port, and declaring one would add a scheduling
            # constraint on a DaemonSet that is one-per-node anyway.
            - name: metrics
              containerPort: 29655
          env:
            # spec.nodeName, not the container hostname: the node's name is
            # what the CO matches a volume's topology against.
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The address the metrics listener binds.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          # Liveness comes from the liveness-probe sidecar, which calls the CSI
          # Identity.Probe RPC over the shared socket and serves the result on
          # node.healthPort. That RPC deliberately never contacts the Qumulo cluster
          # (see IdentityServer.Probe: a probe that did contact the cluster
          # once reported "Ready" for 36 minutes with a dead token), so this
          # restarts the container for a wedged driver, not for an
          # unreachable cluster.
          #
          # The port is numeric rather than named because the name is declared
          # on the sidecar, not here -- and a numeric port is all that is
          # needed, since containers in a pod share a network namespace. An
          # earlier note claimed the probe was impossible for that reason; it
          # is not, and without it the sidecar served /healthz that nothing
          # ever read.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 29653
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Ready only once the kubelet has registered the plugin. The kubelet
          # calls NodeGetInfo after it picks up the registrar's socket and
          # before it writes CSINode; the driver records that call in the
          # marker. A socket in a directory the kubelet does not watch never
          # gets that call, so the pod stays NotReady and the rollout stops at
          # the first node instead of reaching every node.
          readinessProbe:
            exec:
              command:
                - /qumulo-csi-driver
                - -check-registration=/run/qumulo-csi/registered
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            # Pod-scoped: kept across a driver-container restart (which
            # brings no new NodeGetInfo), gone with the pod.
            - name: registration-state
              mountPath: /run/qumulo-csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet
              # Bidirectional so a mount made here propagates back to the host
              # and into the pods that asked for it. Without it the volume
              # mounts inside this container and nowhere else.
              mountPropagation: Bidirectional
          resources:
            limits:
              ephemeral-storage: 500Mi
              memory: 256Mi
            requests:
              cpu: 20m
              ephemeral-storage: 16Mi
              memory: 256Mi
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.qumulo.com
            type: DirectoryOrCreate
        - name: registration-state
          emptyDir: {}
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
      tolerations:
        - operator: Exists
---
# Source: qumulo-csi-driver/templates/controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qumulo-csi-qumulo-csi-driver-controller
  namespace: qumulo-csi
  labels:
    helm.sh/chart: qumulo-csi-driver-0.1.1
    app.kubernetes.io/name: qumulo-csi-driver
    app.kubernetes.io/instance: qumulo-csi
    app.kubernetes.io/version: "0.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: qumulo-csi-driver
    app.kubernetes.io/component: controller
  # kube-linter reads a probe's port against the probed container's own ports.
  # The driver's probes read /healthz on 29652, which the liveness-probe
  # sidecar in the same pod serves and declares; declaring it on the driver
  # too makes the API server warn about a duplicate port on every install.
  annotations:
    ignore-check.kube-linter.io/liveness-port: "the driver probes the /healthz of the liveness-probe sidecar on 29652, declared on that sidecar in the same pod"
    ignore-check.kube-linter.io/readiness-port: "the driver probes the /healthz of the liveness-probe sidecar on 29652, declared on that sidecar in the same pod"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qumulo-csi-driver
      app.kubernetes.io/instance: qumulo-csi
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        helm.sh/chart: qumulo-csi-driver-0.1.1
        app.kubernetes.io/name: qumulo-csi-driver
        app.kubernetes.io/instance: qumulo-csi
        app.kubernetes.io/version: "0.1.1"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: qumulo-csi-driver
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: qumulo-csi-qumulo-csi-driver-controller
      # Explicit rather than inherited. The driver waits up to
      # shutdownGracePeriod (10s) for in-flight handlers and then stops
      # outright, so this only has to be comfortably larger. The wait does not
      # let an RPC finish -- the sidecars exit on the same signal and its
      # context is cancelled at once -- so it covers rollbacks, which run on a
      # context of their own.
      terminationGracePeriodSeconds: 90
      # The controller serves every storage operation in the cluster; evicted
      # first under node pressure as BestEffort, it stopped them all.
      priorityClassName: "system-cluster-critical"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.1@sha256:9e76a2c599ffd7a66f08feeb62ddec61e3545eaa442f8f8f6a495569c0b06829
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          args:
            - --csi-address=$(ADDRESS)
            - --timeout=60s
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            
            - --extra-create-metadata
            # Always on: it serves the /healthz/leader-election the probes below
            # read, and the sidecar's own metrics (csi_sidecar_operations_seconds,
            # how long *this container* waited on an RPC, retries included),
            # which only metrics.enabled publishes through a Service. pprof
            # stays off (no --enable-pprof).
            #
            # --http-endpoint and not --metrics-address: they are the same
            # flag, the latter is the deprecated spelling, and csi-lib-utils
            # refuses to start when both are given.
            - --http-endpoint=:29656
            - --v=2
          # Named after the sidecar, as on the metrics Service: the driver's
          # port is "metrics", and a pod with two ports of one name warns on
          # every install and upgrade.
          ports:
            - name: provisioner
              containerPort: 29656
          livenessProbe:
            httpGet:
              path: /healthz/leader-election
              port: provisioner
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz/leader-election
              port: provisioner
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            limits:
              ephemeral-storage: 500Mi
              memory: 512Mi
            requests:
              cpu: 5m
              ephemeral-storage: 16Mi
              memory: 512Mi

        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.3.1@sha256:d5b040c2f6ffb25127169feeb845aaf1fa3279e510d71fbebe386b5becc625cc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          args:
            - --csi-address=$(ADDRESS)
            - --timeout=60s
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            
            # Expansion is a quota change on the cluster, so there is no
            # node-side step and a volume in use does not block it.
            - --handle-volume-inuse-error=false
            # Always on, for the probes below; see the provisioner.
            - --http-endpoint=:29657
            - --v=2
          ports:
            - name: resizer
              containerPort: 29657
          livenessProbe:
            httpGet:
              path: /healthz/leader-election
              port: resizer
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz/leader-election
              port: resizer
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            limits:
              ephemeral-storage: 500Mi
              memory: 256Mi
            requests:
              cpu: 5m
              ephemeral-storage: 16Mi
              memory: 256Mi
        # Watches VolumeSnapshot objects and calls CreateSnapshot/DeleteSnapshot
        # on this driver. Off unless enabled, because it cannot start without
        # the cluster-wide snapshot CRDs -- and a container that will not start
        # takes the whole controller pod, provisioning included, with it.
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.7.1@sha256:b534b99edb61a5f95e297da8e2a133d36e27ad098e2f643393986e86f093d425
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          args:
            - --csi-address=$(ADDRESS)
            - --timeout=60s
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            
            # Adds the VolumeSnapshot's name and namespace to CreateSnapshot, so
            # a failure is traceable to a specific object. The driver allowlists
            # the csi.storage.k8s.io/ prefix, so these do not trip its strict
            # unknown-parameter rejection.
            - --extra-create-metadata
            # The driver is given the same prefix: it is how DeleteSnapshot
            # tells the snapshots this sidecar asked for from anyone else's.
            - --snapshot-name-prefix=snapshot
            # Always on, for the probes below; see the provisioner.
            - --http-endpoint=:29658
            - --v=2
          ports:
            - name: snapshotter
              containerPort: 29658
          livenessProbe:
            httpGet:
              path: /healthz/leader-election
              port: snapshotter
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz/leader-election
              port: snapshotter
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            limits:
              ephemeral-storage: 500Mi
              memory: 128Mi
            requests:
              cpu: 5m
              ephemeral-storage: 16Mi
              memory: 128Mi
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.1@sha256:d06ac4f9242654f278d9c8a4e343b0516542bfc614218d469959c6428765e97f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:29652
          ports:
            - name: healthz
              containerPort: 29652
          # This container's own health: its listener accepts connections. Not
          # /healthz, which reports the driver's health -- failing on it would
          # restart this sidecar for the driver's fault. The driver container
          # below is the one that probes /healthz.
          livenessProbe:
            tcpSocket:
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            limits:
              ephemeral-storage: 500Mi
              memory: 128Mi
            requests:
              cpu: 5m
              ephemeral-storage: 16Mi
              memory: 128Mi

        - name: qumulo-csi-driver
          image: ghcr.io/qumulo/qumulo-csi-public/qumulo-csi-driver-controller:0.1.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          imagePullPolicy: Always
          # controller.resources is this container's, as the schema always said;
          # it used to reach only the sidecars, leaving the driver -- the one
          # container whose memory grows with listings and restores -- with no
          # request at all.
          resources:
            limits:
              ephemeral-storage: 500Mi
              memory: 1Gi
            requests:
              cpu: 20m
              ephemeral-storage: 16Mi
              memory: 1Gi
          # The image defaults to -mode=controller, but the mode is spelled out
          # here so reading the manifest tells you which role this pod plays.
          args:
            - -mode=controller
            - -endpoint=unix:///csi/csi.sock
            - -drivername=csi.qumulo.com
            - -qumulo-api-timeout=10s
            - -log-level=info
            # csi-snapshotter's --snapshot-name-prefix: a snapshot named
            # otherwise is not this driver's to delete without consent.
            - -snapshot-name-prefix=snapshot
            # The driver's half of requireAllowedClients: CreateVolume refuses
            # an open dedicated-export class made outside this chart.
            - -require-allowed-clients=true
            # Serves /metrics and a process-liveness /healthz.
            # Unrelated to the livenessProbe below, which reaches the
            # livenessprobe sidecar's /healthz on :29652 and is what restarts
            # this container -- nothing restarts on anything served here.
            - -metrics-address=:29654
          ports:
            - name: metrics
              containerPort: 29654
          # Liveness comes from the liveness-probe sidecar, which calls the CSI
          # Identity.Probe RPC over the shared socket and serves the result on
          # :29652. That RPC deliberately never contacts the Qumulo cluster
          # (see IdentityServer.Probe: a probe that did contact the cluster
          # once reported "Ready" for 36 minutes with a dead token), so this
          # restarts the container for a wedged driver, not for an
          # unreachable cluster.
          #
          # The port is numeric rather than named because the name is declared
          # on the sidecar, not here -- and a numeric port is all that is
          # needed, since containers in a pod share a network namespace. An
          # earlier note claimed the probe was impossible for that reason; it
          # is not, and without it the sidecar served /healthz that nothing
          # ever read.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 29652
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # The same Identity.Probe, so a replica whose driver does not answer
          # on its socket is not counted Ready -- by the rollout, and by the
          # PodDisruptionBudget below. Like liveness, it never contacts a
          # Qumulo cluster.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 29652
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
      # Soft: spread the replicas over nodes when the cluster has them, and
      # still schedule on a single-node cluster. With both on one node, that
      # node's drain or failure stopped every storage operation.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: qumulo-csi-driver
                    app.kubernetes.io/instance: qumulo-csi
                    app.kubernetes.io/component: controller
