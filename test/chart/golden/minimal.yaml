---
# Source: qumulo-csi-driver/templates/priorityclass.yaml
# The node pods' PriorityClass. Cluster-scoped, and removed with the
# release. By default it never preempts: the node plugin does not evict
# workloads to fit, it only keeps ordinary pods from preempting it. The cost:
# a node plugin pod re-rolled onto a packed node can stay Pending,
# and that node then has no plugin, so no Qumulo volume on it can mount or
# unmount. node.priorityClass.preemptionPolicy: PreemptLowerPriority, as
# system-node-critical has, trades the other way. An existing class keeps the
# policy it was made with, because the field is immutable.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: qumulo-csi-qumulo-csi-driver-node-critical
  labels:
    helm.sh/chart: qumulo-csi-driver-0.1.1
    app.kubernetes.io/name: qumulo-csi-driver
    app.kubernetes.io/instance: qumulo-csi
    app.kubernetes.io/version: "0.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: qumulo-csi-driver
value: 1000000000
globalDefault: false
preemptionPolicy: Never
description: "Qumulo CSI node plugin: mounts and unmounts every Qumulo volume on its node."
---
# Source: qumulo-csi-driver/templates/controller.yaml
# A drain evicts one controller at a time, so a standby is always left to
# take the leases. Only with more than one replica: with one, a PDB
# would block every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qumulo-csi-qumulo-csi-driver-controller
  namespace: qumulo-csi
  labels:
    helm.sh/chart: qumulo-csi-driver-0.1.1
    app.kubernetes.io/name: qumulo-csi-driver
    app.kubernetes.io/instance: qumulo-csi
    app.kubernetes.io/version: "0.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: qumulo-csi-driver
    app.kubernetes.io/component: controller
spec:
  maxUnavailable: 1
  # A replica that is Running but not Ready -- a crash-looping or wedged
  # controller -- may always be evicted. With the default (IfHealthyBudget) a
  # drain would wait on it whenever the other replica was also unready, and
  # a node drain or cluster upgrade would hang on a pod that serves nothing.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: qumulo-csi-driver
      app.kubernetes.io/instance: qumulo-csi
      app.kubernetes.io/component: controller
---
