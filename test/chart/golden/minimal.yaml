# Source: qumulo-csi-driver/templates/rbac.yaml
# The RoleBindings and the ClusterRoleBinding that give these roles to the
# service accounts are in rbac-bindings.yaml, all in one place, so that
# rbac.createBindings=false can leave every one of them to a platform team.
#
# Permissions required by the deployed sidecars, scoped to what they actually
# call. There is no attacher, so no volumeattachments. The snapshot resources
# appear only when sidecars.snapshotter.enabled is set.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qumulo-csi-qumulo-csi-driver-controller
  labels:
    helm.sh/chart: qumulo-csi-driver-0.1.1
    app.kubernetes.io/name: qumulo-csi-driver
    app.kubernetes.io/instance: qumulo-csi
    app.kubernetes.io/version: "0.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: qumulo-csi-driver
rules:
  # Per-cluster API tokens. csi-provisioner and csi-resizer read the Secret a
  # StorageClass names in csi.storage.k8s.io/*-secret-name and deliver its
  # contents in the RPC's secrets map -- which is how one controller
  # authenticates to several Qumulo clusters.
  #
  # With sidecars.capacity.enabled, the driver container reads the same Secrets
  # itself. That needs no extra rule: every container in the pod shares this
  # ServiceAccount, so the driver already had this right and capacity reporting
  # adds no privilege. It only changes which container exercises it: the
  # request names the Secret to read, so the driver resolves a reference rather
  # than searching for one. ListVolumes and ControllerGetVolume name no Secret,
  # and are served only with controller.inventory.enabled, which reads this
  # driver's StorageClasses, PersistentVolumes and their provisioner Secrets
  # through this ClusterRole -- again no extra rule.
  #
  # Cluster-wide only on request (rbac.clusterWideSecrets): six containers
  # share this ServiceAccount, and a compromise of any one could read any
  # Secret it could name. By default the controller may read exactly
  # the Secrets this release's classes name, through the namespaced Roles at
  # the end of this file.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # csi-provisioner v6 and csi-resizer v2 turn their VolumeAttributesClass
  # gate on by themselves whenever the cluster serves storage.k8s.io/v1
  # VolumeAttributesClass -- every cluster this chart installs on (1.35+).
  # The provisioner then reads the class a claim names, through an informer;
  # without list/watch here that informer is refused and retried for ever.
  # Upstream's RBAC for both sidecars carries this rule. Read-only, and it
  # adds no behaviour: the driver advertises no MODIFY_VOLUME, so the
  # resizer starts no modify controller and no ControllerModifyVolume is sent.
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  # What client-go's event recorder uses; nothing reads one by name.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  # No cluster-wide pods access. Nothing in this pod lists or watches
  # pods: csi-resizer's pod informer runs only with handle-volume-inuse-error,
  # which the chart turns off; csi-snapshotter reads none; and the two
  # sidecars that read a pod read their own, through the -controller-self
  # Role below. A cluster-wide list/watch here let the controller read every
  # pod spec in the cluster, environment variables included.
---
