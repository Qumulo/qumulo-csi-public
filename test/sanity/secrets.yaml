# Credentials csi-sanity supplies with each RPC.
#
# The driver keeps no fallback token: every controller call authenticates from
# the secrets on its own request, the same way the external-provisioner passes
# what a StorageClass's csi.storage.k8s.io/*-secret-name points at. Without this
# file every CreateVolume in the suite would be refused with InvalidArgument.
#
# The value must match the -token the mock server is started with in
# run-test.sh. It used to say the mock "accepts any token", which was true and
# was the problem: nothing checked that the driver sent a credential at all.
CreateVolumeSecret:
  token: sanity-test-token
DeleteVolumeSecret:
  token: sanity-test-token
ControllerValidateVolumeCapabilitiesSecret:
  token: sanity-test-token
ControllerExpandVolumeSecret:
  token: sanity-test-token
CreateSnapshotSecret:
  token: sanity-test-token
DeleteSnapshotSecret:
  token: sanity-test-token
  # csi-sanity names its snapshots freely ("DeleteSnapshot-snapshot-1-..."),
  # not "snapshot-<uid>" as csi-snapshotter does, so the driver takes them
  # for foreign ones and refuses to delete them without this consent.
  # TestDeleteSnapshotIsScopedToThisDriversVolumes covers the refusal.
  allowForeignSnapshotDelete: "true"
ListSnapshotsSecret:
  token: sanity-test-token
